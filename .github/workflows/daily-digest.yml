name: Daily Engineering Digest

on:
  # Run every day at 9 AM UTC (5 PM Beijing Time)
  schedule:
    - cron: '0 9 * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configure email (if secrets are set)
        run: |
          if [ -n "${{ secrets.SMTP_USER }}" ]; then
            echo "Configuring email delivery..."
            # Update config.yml with email settings from secrets
            python -c "
          import yaml
          with open('config.yml', 'r') as f:
              config = yaml.safe_load(f)

          # Enable email if SMTP credentials are provided
          config['output']['email']['enabled'] = True
          config['output']['email']['smtp_user'] = '${{ secrets.SMTP_USER }}'
          config['output']['email']['smtp_password'] = '${{ secrets.SMTP_PASSWORD }}'
          config['output']['email']['from_email'] = '${{ secrets.SMTP_FROM_EMAIL }}'
          config['output']['email']['to_emails'] = '${{ secrets.SMTP_TO_EMAILS }}'.split(',')

          with open('config.yml', 'w') as f:
              yaml.dump(config, f, default_flow_style=False)

          print('Email configuration updated from secrets')
            "
          else
            echo "Email secrets not configured, skipping email delivery"
          fi

      - name: Generate digest
        run: |
          eng-digest run --config config.yml

      # Note: `eng-digest generate-index` is deliberately not run here. It
      # rewrites the repository-root index.html — a legacy standalone page that
      # nothing deploys any more (the site's home page is built from
      # site/src/pages/index.astro) — and stamps it with the current time, so
      # every run looked "changed" and triggered a full rebuild and deploy even
      # on days with no new articles. The command still works locally.
      - name: Commit and push if changed
        id: commit
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add digests/ rss.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily digest $(date +%Y-%m-%d)"
            # Another push (a human commit, or a retried run) may have landed
            # while this job was fetching; rebase onto it rather than failing.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not push the digest after 3 attempts"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

  # Runs in the same workflow run right after a digest commit, so the new
  # digest is live the same day instead of waiting for the next human push
  # (a commit made with the default GITHUB_TOKEN doesn't reliably trigger
  # deploy-site.yml's own push trigger). Skipped entirely when there was
  # nothing new to commit, so an unchanged day doesn't redeploy for no reason.
  deploy:
    needs: generate-digest
    if: needs.generate-digest.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deploy-site.yml
    with:
      ref: main
