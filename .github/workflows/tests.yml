name: Tests

# Nothing used to run the Python test suite in CI: the three existing workflows
# only build the site and generate the daily digest, so a break in the digest
# pipeline would only surface as a silently empty or wrong digest the next day.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Keep in step with build-deploy-site.yml; site/package.json's
          # `engines` field holds the actual floor (Node >=22.19).
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Test client-side feature logic
        working-directory: site
        run: npm test

      # build-deploy-site.yml type-checks and builds, but it only runs on a
      # push to main — so without these two steps a pull request could pass
      # every check here and still break the site the moment it merged. The
      # build also runs check-internal-links, which is the only thing that
      # catches a broken route or asset path.
      - name: Import Engineering Digest markdown
        working-directory: site
        run: npm run import-digests

      - name: Type-check and validate content schemas
        working-directory: site
        env:
          PUBLIC_NEWSLETTER_FORM_URL: ${{ vars.PUBLIC_NEWSLETTER_FORM_URL }}
        run: npm run check

      - name: Build site
        working-directory: site
        env:
          PUBLIC_NEWSLETTER_FORM_URL: ${{ vars.PUBLIC_NEWSLETTER_FORM_URL }}
        run: npm run build

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  config:
    # The daily job is only as good as config.yml parsing, and that file is
    # edited by hand far more often than the code around it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate config.yml
        run: |
          python -c "
          from eng_digest.config import load_config
          config = load_config('config.yml')
          enabled = [b for b in config.blogs if b.enabled]
          assert enabled, 'config.yml has no enabled blog sources'
          print(f'config.yml OK: {len(enabled)} enabled source(s) of {len(config.blogs)}')
          "
