name: Deploy Site

# Website build/deploy for normal human pushes. Publishing a manually
# written article is: write Markdown under site/src/content/, commit,
# push — this is what builds and deploys it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deploy-site.yml
