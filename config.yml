# Eng Digest Configuration File
# Simple test configuration

# Blog sources to fetch from
blogs:
  # Meta (Facebook) Engineering
  - name: Meta Engineering
    url: https://engineering.fb.com/feed/
    type: rss
    enabled: true

  # Uber Engineering — disabled: the feed has been returning 404/406 to
  # non-browser clients for a long time, and the HTML fallback is blocked too.
  # Re-enable if Uber publishes a working feed again.
  - name: Uber Engineering
    url: https://www.uber.com/blog/rss/
    type: rss
    enabled: false

  # Netflix Tech Blog
  - name: Netflix TechBlog
    url: https://netflixtechblog.com/feed
    type: rss
    enabled: true

  # Google Developers Blog
  - name: Google Developers
    url: https://developers.googleblog.com/feeds/posts/default
    type: atom
    enabled: true

  # Dropbox Tech Blog
  - name: Dropbox Engineering
    url: https://dropbox.tech/feed
    type: rss
    enabled: true

  # Stripe Engineering Blog
  - name: Stripe Engineering
    url: https://stripe.com/blog/feed.rss
    type: rss
    enabled: true

  # LinkedIn Engineering — disabled: the endpoint serves malformed XML that
  # feedparser rejects, and the HTML fallback only ever produced a single
  # bogus "Feed blog posts" entry pointing back at the feed URL itself.
  - name: LinkedIn Engineering
    url: https://www.linkedin.com/blog/engineering/feed
    type: rss
    enabled: false

  # Cloudflare Blog
  - name: Cloudflare Engineering
    url: https://blog.cloudflare.com/rss/
    type: rss
    enabled: true

  # Slack Engineering
  - name: Slack Engineering
    url: https://slack.engineering/feed/
    type: rss
    enabled: true

  # Spotify Engineering
  - name: Spotify Engineering
    url: https://engineering.atspotify.com/feed
    type: rss
    enabled: true

  # Airbnb Engineering
  - name: Airbnb Engineering
    url: https://medium.com/feed/airbnb-engineering
    type: rss
    enabled: true

  # Shopify Engineering
  - name: Shopify Engineering
    url: https://shopify.engineering/blog.atom
    type: atom
    enabled: true

  # GitHub Blog
  - name: GitHub Blog
    url: https://github.blog/feed/
    type: rss
    enabled: true

  # AWS News Blog
  - name: AWS News
    url: https://aws.amazon.com/blogs/aws/feed/
    type: rss
    enabled: true

# Fetching configuration
fetch:
  # Only include articles published within this many hours
  lookback_hours: 720  # 30 days to ensure we get some articles

  # Maximum articles to fetch per blog
  max_posts_per_blog: 3

  # Maximum total articles across all blogs
  max_total_posts: 20

  # Skip articles that already appeared in a committed digest under
  # output.path. Keep this on: eng_digest.db is gitignored and never restored
  # in CI, so without it every run republishes the whole lookback window.
  dedupe_against_digests: true

# Summarization configuration
summary:
  # Summarization method: first_paragraph, textrank
  method: textrank

# Output configuration
output:
  # Output type: markdown, html, text
  type: markdown

  # Directory to save digests
  path: ./digests

  # Email configuration (optional)
  # To use Gmail:
  # 1. Enable 2-Step Verification in your Google Account
  # 2. Generate an App Password: https://myaccount.google.com/apppasswords
  # 3. Use the App Password instead of your regular password
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_user: your-email@gmail.com
    smtp_password: your-app-password  # Use App Password for Gmail
    from_email: your-email@gmail.com
    to_emails:
      - your-email@gmail.com
    use_tls: true
    use_ssl: false

  # Telegram configuration (optional)
  telegram:
    enabled: false
