<rect width="1200" height="760" fill="#fcf9f2"/>
<g fill="#193341" font-family="Arial, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<rect x="48" y="50" width="8" height="42" fill="#167b82"/>
<text x="76" y="82" font-size="36" font-weight="700">三种环境记录，各有边界</text>
<text x="76" y="124" font-size="24">比较记录机制、空间范围和年代误差</text>
<rect x="55" y="175" width="345" height="465" rx="12" fill="#ffffff" stroke="#c8c2b6" stroke-width="2"/>
<rect x="56" y="176" width="343" height="8" fill="#167b82"/>
<text x="77" y="226" text-anchor="start" font-size="31" font-weight="700" fill="#193341">
<tspan x="77" dy="0">聚落</tspan>
</text>
<text x="77" y="271" text-anchor="start" font-size="25" font-weight="400" fill="#193341">
<tspan x="77" dy="0">人选择和带入的植物</tspan>
</text>
<path d="M155 370 L225 310 L295 370 M175 355 V416 H275 V355" fill="none" stroke="#167b82" stroke-width="5"/>
