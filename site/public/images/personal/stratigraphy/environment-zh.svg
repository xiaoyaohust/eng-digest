<tspan x="77" dy="0">种子、木炭、植硅体</tspan>
</text>
<text x="77" y="553" text-anchor="start" font-size="24" font-weight="400" fill="#193341">
<tspan x="77" dy="0">燃料不等于全部植被</tspan>
<tspan x="77" dy="42">检查用途与保存过程</tspan>
</text>
<rect x="430" y="175" width="345" height="465" rx="12" fill="#ffffff" stroke="#c8c2b6" stroke-width="2"/>
<rect x="431" y="176" width="343" height="8" fill="#167b82"/>
<text x="452" y="226" text-anchor="start" font-size="31" font-weight="700" fill="#193341">
