</text>
<text x="452" y="553" text-anchor="start" font-size="24" font-weight="400" fill="#193341">
<tspan x="452" dy="0">百分比不等于覆盖率</tspan>
<tspan x="452" dy="42">深度需要年代模型</tspan>
</text>
<rect x="805" y="175" width="345" height="465" rx="12" fill="#ffffff" stroke="#c8c2b6" stroke-width="2"/>
<rect x="806" y="176" width="343" height="8" fill="#167b82"/>
