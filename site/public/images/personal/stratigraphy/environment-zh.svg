<path d="M580 370 H616" stroke="#8c7055" stroke-width="3"/>
<path d="M580 395 H616" stroke="#8c7055" stroke-width="3"/>
<path d="M580 420 H616" stroke="#8c7055" stroke-width="3"/>
<text x="452" y="485" text-anchor="start" font-size="24" font-weight="400" fill="#193341">
