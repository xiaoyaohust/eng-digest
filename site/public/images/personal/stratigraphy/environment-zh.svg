</text>
<text x="452" y="271" text-anchor="start" font-size="25" font-weight="400" fill="#193341">
<tspan x="452" dy="0">汇集不同来源的沉积</tspan>
</text>
<path d="M485 325 Q525 309 565 325 T645 325 T725 325" fill="none" stroke="#167b82" stroke-width="3"/>
