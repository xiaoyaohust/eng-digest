<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Damage mask comparison on a six by eight image</title>
  <desc id="desc">Reference and prediction each contain six foreground pixels. Four pixels overlap, two are missed, and two are extra. Their union has eight pixels and their intersection over union is one half.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 H 0 V 28" fill="none" stroke="#bccbd7" stroke-width="1"/>
    </pattern>
    <g id="overlay">
      <rect width="224" height="168" fill="url(#grid)" stroke="#8a9eb0"/>
      <g fill="#526579" font-size="13" text-anchor="middle">
        <text x="14" y="-9">0</text><text x="42" y="-9">1</text>
        <text x="70" y="-9">2</text><text x="98" y="-9">3</text>
        <text x="126" y="-9">4</text><text x="154" y="-9">5</text>
        <text x="182" y="-9">6</text><text x="210" y="-9">7</text>
        <text x="-13" y="19">0</text><text x="-13" y="47">1</text>
        <text x="-13" y="75">2</text><text x="-13" y="103">3</text>
        <text x="-13" y="131">4</text><text x="-13" y="159">5</text>
      </g>
    </g>
  </defs>
  <rect x="1" y="1" width="958" height="328" rx="12" fill="#f8fafc" stroke="#cbd5df"/>
  <g font-family="Arial, sans-serif">
    <g fill="#182c40" font-size="21" font-weight="700">
      <text x="40" y="34">Reference</text>
      <text x="360" y="34">Prediction</text>
      <text x="680" y="34">Overlap and errors</text>
    </g>
    <g transform="translate(40 78)">
      <rect width="224" height="168" fill="#eaf0f5"/>
      <g fill="#168c95">
        <rect data-pixel="1,2" x="56" y="28" width="28" height="28"/>
        <rect data-pixel="1,3" x="84" y="28" width="28" height="28"/>
        <rect data-pixel="2,2" x="56" y="56" width="28" height="28"/>
        <rect data-pixel="2,3" x="84" y="56" width="28" height="28"/>
        <rect data-pixel="3,3" x="84" y="84" width="28" height="28"/>
        <rect data-pixel="4,3" x="84" y="112" width="28" height="28"/>
      </g>
      <use href="#overlay"/>
    </g>
    <g transform="translate(360 78)">
      <rect width="224" height="168" fill="#eaf0f5"/>
      <g fill="#5272bc">
        <rect data-pixel="1,3" x="84" y="28" width="28" height="28"/>
        <rect data-pixel="1,4" x="112" y="28" width="28" height="28"/>
        <rect data-pixel="2,3" x="84" y="56" width="28" height="28"/>
        <rect data-pixel="2,4" x="112" y="56" width="28" height="28"/>
        <rect data-pixel="3,3" x="84" y="84" width="28" height="28"/>
        <rect data-pixel="4,3" x="84" y="112" width="28" height="28"/>
      </g>
      <use href="#overlay"/>
    </g>
    <g transform="translate(680 78)">
      <rect width="224" height="168" fill="#eaf0f5"/>
      <g fill="#168c95">
        <rect data-overlap="1,3" x="84" y="28" width="28" height="28"/>
        <rect data-overlap="2,3" x="84" y="56" width="28" height="28"/>
        <rect data-overlap="3,3" x="84" y="84" width="28" height="28"/>
        <rect data-overlap="4,3" x="84" y="112" width="28" height="28"/>
      </g>
      <g fill="#d79a33">
        <rect data-missed="1,2" x="56" y="28" width="28" height="28"/>
        <rect data-missed="2,2" x="56" y="56" width="28" height="28"/>
      </g>
      <g fill="#5272bc">
        <rect data-extra="1,4" x="112" y="28" width="28" height="28"/>
        <rect data-extra="2,4" x="112" y="56" width="28" height="28"/>
      </g>
      <use href="#overlay"/>
    </g>
    <g fill="#526579" font-size="16">
      <text x="40" y="278">6 foreground pixels</text>
      <text x="360" y="278">6 foreground pixels</text>
      <text x="680" y="278">4 shared / 8 in union = 0.50 IoU</text>
    </g>
    <g font-size="14">
      <rect x="40" y="299" width="12" height="12" fill="#168c95"/>
      <text x="59" y="310" fill="#526579">Shared foreground</text>
      <rect x="245" y="299" width="12" height="12" fill="#d79a33"/>
      <text x="264" y="310" fill="#526579">Missed foreground</text>
      <rect x="447" y="299" width="12" height="12" fill="#5272bc"/>
      <text x="466" y="310" fill="#526579">Extra foreground</text>
    </g>
  </g>
</svg>
